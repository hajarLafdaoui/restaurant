    <style>

      body{

      .container {
        background-color: #fff;
        max-width: 600px; /* Makes the form container narrower */
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); /* Black shadow with some blur */

  label{

  /*  */

  .checkbox {
  appearance: none;
  width: 30px;
  aspect-ratio: 1;
  border-radius: 8px;
  border: 2px solid black;
  position: relative;
  transition: all 0.2s ease-in-out;
}

.checkbox::before {
  font-family: "Quicksand", sans-serif;
  position: absolute;
  bottom: -4px;
  left: 1px;
  content: "✔";
  font-size: 40px;
  color: #00ad54;
  transform: scale(0);
  transition: all 0.2s ease-in-out;
}

.checkbox:checked::before {
  animation: zoom 0.5s ease-in-out;
  transform: scale(1);
}

@keyframes zoom {
  0% {
    transform: scale(0);
  }

  20% {
    transform: scale(1.5);
  }

  40% {
    transform: scale(0.5);
  }

  50% {
    transform: scale(1);
  }

  70% {
    transform: scale(1.2);
  }

  90% {
    transform: scale(0.8);
  }

  100% {
    transform: scale(1);
  }
}
  .HHH{
    color: #666;
    font-size: 18px;
    /* margin-bottom: 22px; */
  }
  /*  */
  .pay {
    position: relative;
    display: inline-block;
    margin-left: 200px ;
    padding: 10px 30px;
    text-align: center;
    font-size: 18px;
    letter-spacing: 1px;
    text-decoration: none;
    color: #00ad54;
    background: transparent;
    cursor: pointer;
    transition: ease-out 0.5s;
    border: 2px solid #00ad54;
    border-radius: 10px;
    box-shadow: inset 0 0 0 0 #00ad54;
  }

  .pay:hover {
    color: white;
    box-shadow: inset 0 -100px 0 0 #00ad54;
  }

  .pay:active {
    transform: scale(0.9);
  }
    </style>
    
</head>
